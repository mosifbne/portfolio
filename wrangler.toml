# Cloudflare Workers config. Cloudflare's GitHub integration (Workers Builds)
# reads this file on every push to main and deploys automatically.
name = "mohamed-yousif-portfolio"
main = "dist/server/index.js"
compatibility_date = "2025-11-01"

[build]
command = "node scripts/build.mjs"

# Leaderboard database (Cloudflare D1).
[[d1_databases]]
binding = "DB"
database_name = "portfolio-leaderboard"
database_id = "80014f91-7597-45b6-9542-8a65bdac255a"
migrations_dir = "drizzle"
